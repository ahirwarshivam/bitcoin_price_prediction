name: Daily Bitcoin Prediction & Data Sync

on:
  schedule:
    # Run everyday at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Prediction Pipeline
        run: |
          python src/update_pipeline.py

      - name: Commit and Push Updated Prediction Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prediction_history.db data/merged_market_data.csv
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(data): auto-update bitcoin prediction and market history [skip ci]"
            git push
          fi
